# Builds the stonecutter matrix (26.1.2 / 26.2 / 26.3) on every push and pull
# request. The stonecutter node set itself lives in stonecutter.properties.toml;
# this workflow only builds it.

name: build
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build the stonecutter matrix
        run: ./gradlew buildAndCollect
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
